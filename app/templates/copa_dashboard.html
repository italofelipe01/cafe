<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copa Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Comic Neue', cursive;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-family: 'Pacifico', cursive;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        .orders-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .order-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            width: 300px;
            display: flex;
            flex-direction: column;
        }
        .order-header {
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .order-header h2 {
            margin: 0;
            font-size: 1.2em;
            color: #e67e22;
        }
        .order-header span {
            font-size: 0.9em;
            color: #7f8c8d;
        }
        .order-items {
            flex-grow: 1;
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .order-items li {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .btn-concluir {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Comic Neue', cursive;
            font-weight: bold;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        .btn-concluir:hover {
            background-color: #2ecc71;
        }
        .empty-message {
            text-align: center;
            color: #7f8c8d;
            font-style: italic;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>Pedidos na Copa</h1>

    <div id="orders-container" class="orders-container">
        <!-- Orders will be injected here -->
        <p class="empty-message">Carregando pedidos...</p>
    </div>

    <script>
        let knownOrderIds = new Set();
        const notificationSound = new Audio("{{ url_for('static', filename='alert.mp3') }}");

        async function fetchOrders() {
            try {
                const response = await fetch('/api/orders');
                const orders = await response.json();
                renderOrders(orders);
                checkNewOrders(orders);
            } catch (error) {
                console.error('Error fetching orders:', error);
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('orders-container');
            container.innerHTML = '';

            if (orders.length === 0) {
                container.innerHTML = '<p class="empty-message">Nenhum pedido pendente.</p>';
                return;
            }

            orders.forEach(order => {
                const card = document.createElement('div');
                card.className = 'order-card';

                let itemsHtml = '';
                for (const [item, quantity] of Object.entries(order.items)) {
                    if (quantity > 0 || quantity === 'Sim') {
                         // Filter out "Não"
                         if (quantity === 'Não' || quantity === 0) continue;

                         itemsHtml += `<li><span>${item}</span> <span>${quantity}</span></li>`;
                    }
                }

                card.innerHTML = `
                    <div class="order-header">
                        <h2>${order.room}</h2>
                        <span>${order.office}</span><br>
                        <small>${order.date} - ${order.time}</small>
                    </div>
                    <ul class="order-items">
                        ${itemsHtml}
                    </ul>
                    <button class="btn-concluir" onclick="completeOrder(${order.id})">Concluir</button>
                `;
                container.appendChild(card);
            });
        }

        function checkNewOrders(orders) {
            let hasNew = false;
            orders.forEach(order => {
                if (!knownOrderIds.has(order.id)) {
                    knownOrderIds.add(order.id);
                    hasNew = true;
                }
            });

            if (hasNew && knownOrderIds.size > 0) { // Check size to avoid sound on initial load if desired, but user wants sound on new order
                 // To avoid playing sound on initial load of existing orders, we might want to initialize knownOrderIds with current orders first.
                 // However, "if the polling detects a new order ID that wasn't there before" implies simple set diff.
                 // If page refresh happens, knownOrderIds resets, so it will play sound for existing pending orders.
                 // Assuming this is acceptable or we can add logic to skip first run.
                 // Let's implement skip first run logic.
                 if (isFirstRun) {
                     isFirstRun = false;
                 } else {
                     notificationSound.play().catch(e => console.log("Audio play failed:", e));
                 }
            }
        }

        let isFirstRun = true;

        async function completeOrder(orderId) {
            if (!confirm('Marcar pedido como concluído?')) return;

            try {
                const response = await fetch(`/api/complete_order/${orderId}`, {
                    method: 'POST'
                });
                const result = await response.json();
                if (result.success) {
                    knownOrderIds.delete(orderId); // Remove from known set so we don't think it's new if it reappears (unlikely)
                    fetchOrders(); // Refresh immediately
                }
            } catch (error) {
                console.error('Error completing order:', error);
            }
        }

        // Poll every 10 seconds
        setInterval(fetchOrders, 10000);

        // Initial fetch
        fetchOrders();

    </script>
</body>
</html>
