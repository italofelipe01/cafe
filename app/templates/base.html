<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Espaço Café EBM{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='icon.png') }}" type="image/png">
</head>
<body>
    <button id="theme-toggle" class="btn-theme-toggle" type="button" aria-label="Alternar tema">
        <span class="icon">☀️</span>
    </button>

    <header class="site-header">
        <img
            src="{{ url_for('static', filename='images/logo-light.png') }}"
            alt="EBM"
            class="site-logo"
            data-theme-logo
        >

        <nav class="top-nav" aria-label="Navegação principal">
            <a href="{{ url_for('main.index') }}">Pedido</a>
            <a href="{{ url_for('main.copa_dashboard') }}">Copa</a>
            <a href="{{ url_for('main.admin_dashboard') }}">Admin</a>
        </nav>
    </header>

    <main class="{% block main_class %}app-shell{% endblock %}">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-stack">
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
