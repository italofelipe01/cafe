{% extends "base.html" %}

{% block title %}Espaço Café EBM{% endblock %}

{% block content %}
<section class="panel panel-narrow">
    <div class="page-heading">
        <p class="eyebrow">Solicitação de copa</p>
        <h1>Espaço Café EBM</h1>
        <p>Escolha o escritório e a sala para montar o pedido.</p>
    </div>

    {% if error %}
    <div class="alert alert-error" role="alert">{{ error }}</div>
    {% endif %}

    <form id="officeForm" class="form-plain" method="POST" action="{{ url_for('main.select_room') }}">
        <label for="office">Escritório</label>
        <select id="office" name="office" required class="form-control">
            <option value="">Selecione um escritório</option>
            {% for office in offices %}
            <option value="{{ office.name }}">{{ office.name }}</option>
            {% endfor %}
        </select>

        <label for="room">Sala</label>
        <select id="room" name="room" required class="form-control" disabled>
            <option value="">Selecione uma sala</option>
        </select>

        <button type="submit" class="btn btn-primary">Avançar</button>
    </form>
</section>
{% endblock %}
