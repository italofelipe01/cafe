name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Permite que o workflow de release reaproveite esta verificação em vez de
  # duplicar os passos: uma única definição do que precisa passar.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Testes
        run: python -m unittest discover -s . -p "test_*.py" -v

  migrations:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Garante que as migrations descrevem exatamente os modelos: se alguém
      # alterar app/models.py sem gerar a migration, este passo falha.
      - name: Aplicar migrations num banco limpo
        env:
          APP_ENV: development
          FLASK_APP: "app:create_app"
          DATABASE_URL: "sqlite:///ci.db"
          AUTO_CREATE_DB: "False"
          SECRET_KEY: chave-de-ci-sem-valor-em-producao
        run: flask db upgrade

      - name: Conferir que não há migration pendente
        env:
          APP_ENV: development
          FLASK_APP: "app:create_app"
          DATABASE_URL: "sqlite:///ci.db"
          AUTO_CREATE_DB: "False"
          SECRET_KEY: chave-de-ci-sem-valor-em-producao
        run: flask db check

      - name: Semear catálogo duas vezes (precisa ser idempotente)
        env:
          APP_ENV: development
          FLASK_APP: "app:create_app"
          DATABASE_URL: "sqlite:///ci.db"
          AUTO_CREATE_DB: "False"
          SECRET_KEY: chave-de-ci-sem-valor-em-producao
        run: |
          flask init-db
          flask init-db | tee segunda-execucao.txt
          grep -q "Criados: 0 escritórios, 0 salas, 0 insumos" segunda-execucao.txt
