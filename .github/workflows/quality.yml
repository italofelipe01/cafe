name: Quality Gate

# Única definição do gate. Roda em PR para main e é chamado pelo Release
# (workflow_call) antes de versionar: um push para main passa por aqui através
# do Release, e não por um gatilho próprio — assim cada push verifica uma vez
# só, e a versão publicada é sempre a do commit que acabou de passar no gate.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    name: Lint, tipos e JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Em PR, um push novo cancela a execução anterior do mesmo PR. Chamado pelo
    # Release, cada execução tem grupo próprio e nunca é cancelada.
    concurrency:
      group: quality-static-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # O pyright roda sobre Node, e o `node --check` valida os scripts do
      # portal, que não têm etapa de build.
      - name: Configurar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # O pyproject aponta o pyright para `.venv` (venvPath/venv). Criar o
      # ambiente no mesmo lugar faz o CI resolver imports exatamente como a
      # máquina de desenvolvimento, sem configuração paralela.
      - name: Instalar dependências em .venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: ruff check .

      - name: Tipos
        run: pyright

      - name: Sintaxe do JavaScript
        run: |
          for arquivo in app/static/*.js; do
            node --check "$arquivo"
          done

  test:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: quality-test-${{ matrix.python-version }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Testes
        run: python -m unittest discover -s . -p "test_*.py" -v

  migrations:
    name: Migrations e semeadura
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: quality-migrations-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    env:
      APP_ENV: development
      FLASK_APP: "app:create_app"
      DATABASE_URL: "sqlite:///ci.db"
      AUTO_CREATE_DB: "False"
      SECRET_KEY: chave-de-ci-sem-valor-em-producao

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Garante que as migrations descrevem exatamente os modelos: se alguém
      # alterar app/models.py sem gerar a migration, este passo falha.
      - name: Aplicar migrations num banco limpo
        run: flask db upgrade

      - name: Conferir que não há migration pendente
        run: flask db check

      - name: Semear catálogo duas vezes (precisa ser idempotente)
        run: |
          flask init-db
          flask init-db | tee segunda-execucao.txt
          grep -q "Criados: 0 escritórios, 0 salas, 0 insumos" segunda-execucao.txt

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: quality-docker-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A imagem é o caminho para a nuvem. Construir e subir aqui garante que
      # ela continua de pé a cada mudança, e não só no dia em que for preciso.
      - name: Construir a imagem
        run: docker build -t copa-pronta:ci .

      - name: Recusar subir sem segredos
        run: |
          if docker run --rm copa-pronta:ci; then
            echo "A imagem subiu sem SECRET_KEY e senhas." >&2
            exit 1
          fi

      - name: Subir, migrar e responder /health
        run: |
          docker run -d --name copa -p 8000:8000 \
            -e SECRET_KEY=chave-de-ci-sem-valor-em-producao-0123456789 \
            -e ADMIN_PASSWORD=ci-admin \
            -e COPA_PASSWORD=ci-copa \
            copa-pronta:ci
          for tentativa in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              # O log da aplicação sai no stderr do contêiner, e `docker logs`
              # o reemite no stderr: sem 2>&1, o grep não recebe nada.
              docker logs copa 2>&1 | grep -q "Banco pronto: migrations aplicadas"
              exit 0
            fi
            sleep 1
          done
          docker logs copa
          exit 1
