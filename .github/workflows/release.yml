name: Release

# Versionamento semântico automático.
#
# A versão é derivada das mensagens de commit desde a última tag, segundo a
# convenção que o projeto já usa (fix -> patch, feat -> minor, BREAKING CHANGE
# -> major).
#
# O disparo é o término do CI, e não o push: assim a verificação roda uma vez
# só. Chamar o CI como workflow reutilizável a partir daqui faria cada push
# executar lint, testes e migrations duas vezes — uma pelo gatilho do próprio
# CI e outra dentro deste workflow.
#
# O passo de release empurra um commit "chore(release): vX.Y.Z" com a versão
# atualizada no pyproject.toml e o CHANGELOG regenerado, cria a tag e publica
# a GitHub Release. Esse commit traz [skip ci] para não reentrar no ciclo.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Permite disparar manualmente pela aba Actions, útil para publicar sem
  # esperar o próximo push.
  workflow_dispatch:

concurrency:
  # Dois releases simultâneos brigariam pela mesma tag.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    # Só publica se o CI que disparou este workflow tiver passado. No disparo
    # manual não há CI associado, e a responsabilidade é de quem clicou.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: write # criar a tag, o commit de versão e a Release

    steps:
      - uses: actions/checkout@v4
        with:
          # O semantic-release precisa do histórico completo e das tags para
          # saber qual foi a última versão e quais commits vieram depois.
          fetch-depth: 0
          # workflow_run roda desanexado do branch; sem isto o commit de versão
          # não teria para onde ir.
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Calcular e aplicar a próxima versão
        id: versao
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions[bot]
          git_committer_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Publicar a GitHub Release
        if: steps.versao.outputs.released == 'true'
        uses: python-semantic-release/publish-action@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.versao.outputs.tag }}

      - name: Resumo
        run: |
          if [ "${{ steps.versao.outputs.released }}" = "true" ]; then
            echo "### Versão ${{ steps.versao.outputs.version }} publicada" >> $GITHUB_STEP_SUMMARY
            echo "Tag: \`${{ steps.versao.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Nenhuma versão publicada" >> $GITHUB_STEP_SUMMARY
            echo "Nenhum commit desde a última tag exige incremento de versão." >> $GITHUB_STEP_SUMMARY
            echo "Apenas \`fix\`, \`feat\`, \`perf\` e \`BREAKING CHANGE\` incrementam." >> $GITHUB_STEP_SUMMARY
          fi
