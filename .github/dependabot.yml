version: 2
updates:
  # Mantém as actions pinadas por SHA atualizadas (SHA e comentário de versão).
  # As dependências Python não entram aqui: requirements.txt não fixa versões,
  # então não há o que o Dependabot propor.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
